name: Generate Lab 1 result graphs

on:
  push:
    paths:
      - ".github/workflows/lab-results.yml"
      - "lab01/**"
      - "requirements.txt"
  workflow_dispatch:
    inputs:
      mode:
        description: "Training size (quick or full)"
        required: true
        type: choice
        default: quick
        options:
          - quick
          - full

permissions:
  contents: write

jobs:
  train-and-save-results:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out lab repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt

      - name: Download Fashion-MNIST from original dataset repository
        run: |
          mkdir -p data/FashionMNIST/raw
          for filename in train-images-idx3-ubyte.gz train-labels-idx1-ubyte.gz t10k-images-idx3-ubyte.gz t10k-labels-idx1-ubyte.gz; do
            curl --fail --location --retry 3 --retry-delay 2 \
              "https://raw.githubusercontent.com/zalandoresearch/fashion-mnist/master/data/fashion/${filename}" \
              --output "data/FashionMNIST/raw/${filename}"
          done

      - name: Run automated tests
        run: python -m pytest -q

      - name: Run Fashion-MNIST and gradient descent experiments
        env:
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'quick' }}
        run: python -m lab01.run --mode "$MODE" --device cpu

      - name: Commit actual generated plots and result tables
        env:
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'quick' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f outputs/*.png outputs/*.csv
          if ! git diff --cached --quiet; then
            git commit -m "Add measured Lab 1 graphs and results ($MODE)"
            git push origin HEAD:main
          fi
